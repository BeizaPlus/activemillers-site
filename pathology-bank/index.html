<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pathology Bank — activemillers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    background: #121212;
    color: #eee;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 40px 24px 80px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 4px;
    color: #fff;
  }
  .subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 40px;
  }
  .board {
    column-count: 3;
    column-gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    .board { column-count: 2; }
  }
  @media (max-width: 560px) {
    .board { column-count: 1; }
  }
  .pin {
    position: relative;
    break-inside: avoid;
    margin-bottom: 20px;
    border-radius: 18px;
    overflow: hidden;
    background: #1c1c1c;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .pin:hover {
    transform: translateY(-6px) scale(1.015);
    box-shadow: 0 16px 32px rgba(0,0,0,0.55);
  }
  .pin img {
    width: 100%;
    display: block;
  }
  .pin .label {
    padding: 14px 16px 16px;
  }
  .pin .label .title {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .pin .label .snippet {
    font-size: 12px;
    color: #999;
    line-height: 1.4;
  }
  .pin .num {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pin .fig-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    color: #ddd;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 20px;
  }
  .controls {
    max-width: 1100px;
    margin: 0 auto 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .search-input {
    width: 100%;
    max-width: 420px;
    background: #1c1c1c;
    border: 1px solid #333;
    color: #eee;
    font-family: inherit;
    font-size: 14px;
    padding: 11px 16px;
    border-radius: 10px;
    outline: none;
  }
  .search-input:focus { border-color: #666; }
  .search-input::placeholder { color: #777; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .filter-pill {
    background: #1c1c1c;
    border: 1px solid #333;
    color: #aaa;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .filter-pill:hover { border-color: #555; color: #fff; }
  .filter-pill.active {
    background: #fff;
    color: #121212;
    border-color: #fff;
  }
  .no-results {
    text-align: center;
    color: #666;
    font-size: 13px;
    padding: 40px 0;
    display: none;
  }
  .pin.hidden { display: none; }
</style>
</head>
<body>

<a href="../index.html" style="display:block;text-align:center;color:#999;font-size:13px;text-decoration:none;padding-top:8px;">&larr; activemillers</a>
<h1>Pathology Bank</h1>
<div class="subtitle">Wheater's Basic Pathology, 3D volumetric renders vs. real plates — click any pin to open</div>

<div class="controls">
  <input class="search-input" id="search" type="text" placeholder="Search the bank (organism, disease, figure)…">
  <div class="filters" id="filters"></div>
</div>

<div class="board" id="gallery"></div>
<div class="no-results" id="no-results">No matches — try a different search or filter.</div>

<script>

  {

    cat: ["Granulomatous"],
    caption: "Non-caseating granuloma, bowel wall. A discrete granuloma resembling sarcoidosis sits in the submucosa near a fissured ulcer, amid transmural chronic inflammation — the \"cobblestone\" mucosa pattern.",
    fig: "Fig. 13.17",

  },

  {

  },
  {

    cat: ["Cardiovascular"],
    caption: "Plaque fissuring lets blood track into the plaque, narrowing the lumen further; the exposed surface then builds a thrombus that can obliterate the vessel or embolise downstream — the sequence behind a real fatal MI case in the book.",
    fig: "Fig. 8.7 / 8.8",

  {

    fig: "Fig. 9.1 / 9.2",

  },
  {
    img: "desmoplasia_panel3_endstate.png",

    cat: ["Neoplasia"],

    fig: "Fig. 18.9(c)",
    href: "entry_desmoplasia.html"
  }
];

const gallery = document.getElementById('gallery');
const noResults = document.getElementById('no-results');
const searchInput = document.getElementById('search');
const filtersEl = document.getElementById('filters');

const allCats = ['All', ...new Set(panels.flatMap(p => p.cat))];
let activeCat = 'All';

allCats.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-pill' + (cat === activeCat ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = () => {
    activeCat = cat;
    [...filtersEl.children].forEach(b => b.classList.toggle('active', b.textContent === cat));
    render();
  };
  filtersEl.appendChild(btn);
});

panels.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'pin';
  div.dataset.index = i;
  div.onclick = () => window.location.href = p.href;
  div.innerHTML = `
    <span class="num">${i+1}</span>
    <span class="fig-badge">${p.fig}</span>
    <img src="${p.img}" alt="${p.title}">
    <div class="label">
      <div class="title">${p.title}</div>
      <div class="snippet">${p.caption.split('.')[0]}.</div>
    </div>
  `;
  gallery.appendChild(div);
});

function render() {
  const q = searchInput.value.trim().toLowerCase();
  let visibleCount = 0;
  [...gallery.children].forEach(div => {
    const p = panels[div.dataset.index];
    const matchesCat = activeCat === 'All' || p.cat.includes(activeCat);
    const haystack = (p.title + ' ' + p.caption + ' ' + p.fig + ' ' + p.cat.join(' ')).toLowerCase();
    const matchesSearch = q === '' || haystack.includes(q);
    const visible = matchesCat && matchesSearch;
    div.classList.toggle('hidden', !visible);
    if (visible) visibleCount++;
  });
  noResults.style.display = visibleCount === 0 ? 'block' : 'none';
}

searchInput.addEventListener('input', render);
</script>

</body>
</html>
